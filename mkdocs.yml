site_name: 吉里吉里Z ドキュメント
site_description: 吉里吉里Z (Kirikiri Z) の TJS2 リファレンス・ガイド・仕様書
site_url: https://wamsoft.github.io/krkrz_dev/
repo_url: https://github.com/wamsoft/krkrz_dev
repo_name: wamsoft/krkrz_dev
edit_uri: edit/develop/doc/
copyright: "(c) Kirikiri Z Project / Wamsoft Ltd. Partnership"

docs_dir: doc

# ブラウザ実行デモ (doc/_assets/demo) を iframe 埋め込みで動かすため、全ページで
# coi-serviceworker を登録し crossOriginIsolated (SharedArrayBuffer) を成立させる。
# GitHub Pages は COOP/COEP ヘッダを設定できないため、SW でクライアント側に注入する。
# 既定 COEP=credentialless なので外部リソース (テーマのフォント等) は壊れにくい。
extra_javascript:
  - coi-serviceworker.js

theme:
  name: material
  # 他言語版の未訳ページに注記を出す (tools/docgen/theme_overrides/main.html)
  custom_dir: tools/docgen/theme_overrides
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: ja
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;'
  # 英語版 (/en/)。訳は Foo.en.md (接尾辞方式)。未訳ページは日本語版をそのまま出す。
  # 言語を増やすときは languages に 1 項目足す (方針 = TODO-i18n.md C)。
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
